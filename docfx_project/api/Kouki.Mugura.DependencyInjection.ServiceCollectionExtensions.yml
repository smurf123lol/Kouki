  - vb
  name: ServiceCollectionExtensions
  nameWithType: ServiceCollectionExtensions
  fullName: Kouki.Mugura.DependencyInjection.ServiceCollectionExtensions
  type: Class
  source:
    id: ServiceCollectionExtensions
    path: F:\Projects\Kouki\Kouki.Mugura\DependencyInjection\ServiceCollectionExtensions.cs
    startLine: 34
  assemblies:
  - Kouki.Mugura
  namespace: Kouki.Mugura.DependencyInjection
  summary: Методы расширения для регистрации ядра Mugura в DI-контейнере.
  remarks: >-
    <p>

    Метод <xref href="Kouki.Mugura.DependencyInjection.ServiceCollectionExtensions.AddMugura(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cSystem.Reflection.Assembly%5b%5d)" data-throw-if-not-resolved="false"></xref> регистрирует все необходимые компоненты:

    </p>

    <ul><li><xref href="Kouki.Mugura.Registry.CommandRegistry" data-throw-if-not-resolved="false"></xref> — синглтон.</li><li><xref href="Kouki.Mugura.Factories.ICommandFactory" data-throw-if-not-resolved="false"></xref> (реализация <xref href="Kouki.Mugura.Factories.CommandFactory" data-throw-if-not-resolved="false"></xref>) — синглтон.</li><li><xref href="Kouki.Mugura.Scope.IScopeManager" data-throw-if-not-resolved="false"></xref> (реализация <xref href="Kouki.Mugura.Scope.ScopeManager" data-throw-if-not-resolved="false"></xref>) — синглтон.</li><li><xref href="Kouki.Mugura.Dispatcher.ICommandDispatcher" data-throw-if-not-resolved="false"></xref> (реализация <xref href="Kouki.Mugura.Dispatcher.CommandDispatcher" data-throw-if-not-resolved="false"></xref>) — синглтон.</li><li><xref href="Kouki.Mugura.Dispatcher.IRouter" data-throw-if-not-resolved="false"></xref> (реализация <xref href="StaticRouter" data-throw-if-not-resolved="false"></xref>) — синглтон.</li><li>Открытый generic <xref href="Kouki.Mugura.Validators.ICommandValidator%601" data-throw-if-not-resolved="false"></xref> → <xref href="Kouki.Mugura.Validators.DataAnnotationsValidator%601" data-throw-if-not-resolved="false"></xref>.</li><li>Все классы, реализующие <xref href="Kouki.Mugura.Handlers.ICommandHandler%601" data-throw-if-not-resolved="false"></xref>, из указанных сборок регистрируются как Scoped.</li></ul>

    <p>

    Если сборки не указаны, используется вызывающая сборка (assembly вызывающего метода).

    </p>

    <p>

    После вызова этого метода можно переопределить валидатор для конкретной команды, 

    зарегистрировав свою реализацию <xref href="Kouki.Mugura.Validators.ICommandValidator%601" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
