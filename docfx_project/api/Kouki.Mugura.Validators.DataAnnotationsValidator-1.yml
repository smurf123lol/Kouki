  assemblies:
  - Kouki.Mugura
  namespace: Kouki.Mugura.Validators
  summary: Валидатор на основе DataAnnotations, использующий правила из <xref href="Kouki.Mugura.Registry.CommandRegistry" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    <p>

    В конструкторе получает <xref href="Kouki.Mugura.Registry.CommandRegistry" data-throw-if-not-resolved="false"></xref>, извлекает для данного типа команды

    список <xref href="Kouki.Mugura.Registry.ValidationRule" data-throw-if-not-resolved="false"></xref> и сохраняет их для последующей проверки.

    </p>

    <p>

    При вызове <xref href="Kouki.Mugura.Validators.DataAnnotationsValidator%601.TryValidate(%600%2cSystem.String%40)" data-throw-if-not-resolved="false"></xref> перебирает все правила и для каждого свойства

    вызывает метод <xref href="System.ComponentModel.DataAnnotations.ValidationAttribute.IsValid(System.Object%2cSystem.ComponentModel.DataAnnotations.ValidationContext)" data-throw-if-not-resolved="false"></xref>.

    Если хотя бы одно правило нарушено, возвращает false и сообщение об ошибке.

    </p>

    <p>

    Кастомные атрибуты валидации (наследники <xref href="System.ComponentModel.DataAnnotations.ValidationAttribute" data-throw-if-not-resolved="false"></xref>) работают 

    автоматически — достаточно применить их к свойствам DTO.

    </p>

    <p>

    Чтобы переопределить валидацию для конкретной команды, зарегистрируйте свою реализацию 

    <xref href="Kouki.Mugura.Validators.ICommandValidator%601" data-throw-if-not-resolved="false"></xref> в DI-контейнере после вызова <xref href="Kouki.Mugura.DependencyInjection.ServiceCollectionExtensions.AddMugura(Microsoft.Extensions.DependencyInjection.IServiceCollection%2cSystem.Reflection.Assembly%5b%5d)" data-throw-if-not-resolved="false"></xref>.

    </p>
  example: []
